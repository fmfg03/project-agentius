<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP System - Phase 2 with LangChain</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>MCP System</h1>
            <div class="subtitle">Phase 2 with LangChain Integration</div>
            <div class="auth-container" id="auth-container">
                <div id="login-form">
                    <input type="text" id="email" placeholder="Email" value="demo@example.com">
                    <input type="password" id="password" placeholder="Password" value="password">
                    <button id="login-button">Login</button>
                </div>
                <div id="user-info" style="display: none;">
                    <span id="user-email"></span>
                    <button id="logout-button">Logout</button>
                </div>
            </div>
        </header>

        <main>
            <div class="sidebar">
                <div class="projects-container">
                    <h2>Projects</h2>
                    <div class="project-list" id="project-list">
                        <!-- Projects will be loaded here -->
                    </div>
                    <div class="new-project">
                        <input type="text" id="new-project-name" placeholder="New Project Name">
                        <textarea id="new-project-description" placeholder="Project Description"></textarea>
                        <button id="create-project-button">Create Project</button>
                    </div>
                </div>
            </div>

            <div class="content">
                <div id="project-details" class="project-details">
                    <div class="no-project-selected" id="no-project-selected">
                        <h2>No Project Selected</h2>
                        <p>Select a project from the sidebar or create a new one to get started.</p>
                    </div>
                    <div class="project-content" id="project-content" style="display: none;">
                        <h2 id="project-title">Project Title</h2>
                        <p id="project-description">Project description will appear here.</p>
                        
                        <div class="conversation-container">
                            <h3>Conversation</h3>
                            <div class="conversation-messages" id="conversation-messages">
                                <!-- Messages will be loaded here -->
                            </div>
                            <div class="message-input">
                                <textarea id="message-input" placeholder="Type your message here..."></textarea>
                                <button id="send-message-button">Send</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <div class="agent-status">
                <div class="agent builder">
                    <div class="agent-label">Builder (Claude)</div>
                    <div class="agent-indicator" id="builder-status">Idle</div>
                </div>
                <div class="agent judge">
                    <div class="agent-label">Judge (GPT-4o)</div>
                    <div class="agent-indicator" id="judge-status">Idle</div>
                </div>
            </div>
            <div class="system-info">
                MCP System v2.0 - LangChain Integration
            </div>
        </footer>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
